resource:
    name: GuestCartItems
    shortName: guest-cart-items

    properties:
        calculations:
            type: object
            objectName: Calculations
            writable: false
            readable: true
            required: false
            properties:
                unitProductOptionPriceAggregation:
                    type: integer
                    description: 'Aggregated product option price per unit in cents.'
                    openapiContext:
                        example: 0
                sumProductOptionPriceAggregation:
                    type: integer
                    description: 'Aggregated product option price for the sum in cents.'
                    openapiContext:
                        example: 0

        selectedProductOptions:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Enriched product-option payloads on the guest-cart item: option group, value, and price. Set by the response mapper from the persisted cart item.'
            openapiContext:
                items:
                    type: object
                    required:
                        - optionGroupName
                        - optionName
                        - sku
                        - price
                    properties:
                        optionGroupName:
                            type: string
                        optionName:
                            type: string
                        sku:
                            type: string
                        price:
                            type: integer
                example:
                    - optionGroupName: 'Warranty'
                      optionName: 'Two (2) year limited warranty'
                      sku: 'OP_1_year_warranty'
                      price: 1000

        productOptions:
            type: array
            writable: true
            writableOn: ['Post']
            readable: false
            required: false
            description: 'Product options chosen by the customer on guest-cart-item create/update. Each entry carries the option-value `sku`; the cart item is recalculated with the matching `idProductOptionValue` resolved server-side.'
            openapiContext:
                example:
                    - sku: 'OP_1_year_warranty'
                    - sku: 'OP_gift_wrapping'
