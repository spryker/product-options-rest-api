resource:
    name: CartItems
    shortName: items

    properties:
        selectedProductOptions:
            type: array
            writable: false
            readable: true
            required: false
            description: 'Enriched product-option payloads on the cart item: option group, value, and price. Set by the response mapper from the persisted cart item.'
            openapiContext:
                example:
                    - optionGroupName: 'Warranty'
                      optionName: 'Two (2) year limited warranty'
                      sku: 'OP_2_year_warranty'
                      price: 1000

        productOptions:
            type: array
            writable: true
            readable: false
            required: false
            description: 'Product options chosen by the customer on cart-item create/update. Each entry carries the option-value `sku`; the cart item is recalculated with the matching `idProductOptionValue` resolved server-side.'
            openapiContext:
                example:
                    - sku: 'OP_2_year_warranty'
                    - sku: 'OP_gift_wrap'
